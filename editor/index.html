<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AE1 — Angel's Egg</title>
  <!-- The AE1 egg (Austin's logo). Icons for tabs and home screens; the link
       preview a shared URL shows. og:image must be an absolute URL, so it names
       the hosted demo — harmless on a local server, where nobody shares a link. -->
  <link rel="icon" href="/editor/assets/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/editor/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/editor/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/editor/assets/icon-512.png">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A browser-based game engine and editor: build 2D and 3D games in your browser and ship them for the web or Windows. Try the hosted demo.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AE1 — Angel's Egg">
  <meta property="og:title" content="AE1 — Angel's Egg">
  <meta property="og:description" content="A browser-based game engine and editor: build 2D and 3D games in your browser and ship them for the web or Windows. Try the hosted demo.">
  <meta property="og:url" content="https://ae1.ausa.dev/">
  <meta property="og:image" content="https://ae1.ausa.dev/editor/assets/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The AE1 logo: a white egg marked AE1 under the words angels egg 1">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AE1 — Angel's Egg">
  <meta name="twitter:description" content="A browser-based game engine and editor: build 2D and 3D games in your browser and ship them for the web or Windows. Try the hosted demo.">
  <meta name="twitter:image" content="https://ae1.ausa.dev/editor/assets/og-image.jpg">

  <!-- Local only. No CDN, ever (DESIGN.md, Principle 5). -->
  <link rel="stylesheet" href="/editor/css/theme.css">
  <link rel="stylesheet" href="/editor/css/app.css">
  <link rel="stylesheet" href="/editor/css/workspace.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>

    <main id="view"></main>

    <footer id="statusbar">
      <span>
        <span class="status-dot" id="status-server" data-state="offline"></span>
        <span id="status-context">Starting…</span>
      </span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- three.js is VENDORED (engine/vendor/three), never a CDN — Principle 5.
       The map lets the addon files resolve their bare `three` / `three/addons/`
       imports to our local copies. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/engine/vendor/three/three.module.js",
      "three/addons/": "/engine/vendor/three/addons/"
    }
  }
  </script>

  <script type="module" src="/editor/js/main.js"></script>
</body>
</html>
